name: Notify Telegram on push

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Escape MarkdownV2 reserved characters in commit message
          ESCAPED_MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -c 800 | python3 -c "
          import sys, re
          msg = sys.stdin.read()
          # Take only first line for the title, keep up to 6 more lines as body
          lines = msg.split('\n')
          first = lines[0][:200]
          rest = '\n'.join(lines[1:7]) if len(lines) > 1 else ''
          def esc(s):
              return re.sub(r'([_*\[\]()~\`>#+\-=|{}.!\\\\])', r'\\\\\1', s)
          out = '*' + esc(first) + '*'
          if rest.strip():
              out += '\n' + esc(rest)
          print(out)
          ")
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          AUTHOR_ESC=$(printf '%s' "$COMMIT_AUTHOR" | python3 -c "
          import sys, re
          s = sys.stdin.read()
          print(re.sub(r'([_*\[\]()~\`>#+\-=|{}.!\\\\])', r'\\\\\1', s))
          ")
          BODY=$(cat <<EOF
          🚀 *vibemakers\\.dev pushed*

          $ESCAPED_MSG

          \`$SHORT_SHA\` · by $AUTHOR_ESC
          [view commit]($COMMIT_URL)
          EOF
          )
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "$BODY" '{chat_id:$chat, text:$text, parse_mode:"MarkdownV2", disable_web_page_preview:true}')"
