    <style>
      .ui { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .t0 { font-size: 18px; font-weight: 600; fill: #0f172a; }
      .t1 { font-size: 13px; font-weight: 500; fill: #334155; }
      .t2 { font-size: 12px; font-weight: 500; fill: #64748b; }
      .t3 { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .chip { font-size: 12px; font-weight: 600; fill: #1d4ed8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New"; font-size: 11px; fill: #475569; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="url(#bg)"/>

  <g filter="url(#shadow)">
