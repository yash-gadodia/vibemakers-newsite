<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <style>
      .ui { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .t0 { font-size: 18px; font-weight: 900; fill: #0f172a; }
      .t1 { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .t2 { font-size: 12px; font-weight: 500; fill: #64748b; }
      .t3 { font-size: 12px; font-weight: 800; fill: #0f172a; }
      .tag { font-size: 11px; font-weight: 800; fill: #1f2937; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="110" y="84" width="980" height="552" rx="18" fill="#ffffff"/>
    <rect x="110" y="84" width="980" height="56" rx="18" fill="#fff1f2"/>
    <rect x="110" y="122" width="980" height="18" fill="#fff1f2"/>

    <circle cx="146" cy="112" r="7" fill="#ef4444"/>
    <circle cx="170" cy="112" r="7" fill="#f59e0b"/>
    <circle cx="194" cy="112" r="7" fill="#22c55e"/>

    <text class="ui t0" x="240" y="118">MusicMood</text>
    <text class="ui t2" x="240" y="138">Spotify playlist generator · Mood → tracks in 10s</text>

    <rect x="140" y="164" width="360" height="440" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="ui t3" x="162" y="196">Pick your vibe</text>
    <rect x="162" y="214" width="316" height="34" rx="999" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="ui t2" x="178" y="236">Search moods…</text>

    <rect x="162" y="266" width="98" height="30" rx="999" fill="#fee2e2"/>
    <text class="ui tag" x="182" y="286" fill="#9f1239">Chill</text>
    <rect x="268" y="266" width="116" height="30" rx="999" fill="#dbeafe"/>
    <text class="ui tag" x="288" y="286" fill="#1e3a8a">Focused</text>
    <rect x="392" y="266" width="86" height="30" rx="999" fill="#dcfce7"/>
    <text class="ui tag" x="412" y="286" fill="#14532d">Happy</text>

    <text class="ui t2" x="162" y="332">Energy</text>
    <rect x="162" y="346" width="316" height="10" rx="999" fill="#e2e8f0"/>
    <rect x="162" y="346" width="212" height="10" rx="999" fill="#ec4899"/>
    <circle cx="374" cy="351" r="10" fill="#ffffff" stroke="#ec4899" stroke-width="3"/>

    <text class="ui t2" x="162" y="392">Tempo</text>
    <rect x="162" y="406" width="316" height="10" rx="999" fill="#e2e8f0"/>
    <rect x="162" y="406" width="156" height="10" rx="999" fill="#e11d48"/>
    <circle cx="318" cy="411" r="10" fill="#ffffff" stroke="#e11d48" stroke-width="3"/>

    <rect x="162" y="466" width="316" height="46" rx="14" fill="#111827"/>
    <text class="ui t3" x="238" y="496" fill="#ffffff">Generate playlist</text>
    <text class="ui t2" x="162" y="540">Connected</text>
    <rect x="238" y="526" width="126" height="28" rx="999" fill="#dcfce7" stroke="#bbf7d0"/>
    <text class="ui tag" x="254" y="545" fill="#14532d">Spotify API OK</text>

    <rect x="520" y="164" width="550" height="440" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="ui t3" x="544" y="196">Generated: “Late‑Night Focus”</text>
    <text class="ui t2" x="544" y="216">12 tracks · ~38 min</text>

    <g class="ui">
      <rect x="544" y="234" width="502" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="560" y="248" width="32" height="32" rx="8" fill="#e9d5ff"/>
      <text class="t1" x="604" y="266">Midnight City</text>
      <text class="t2" x="604" y="284">M83</text>
      <text class="t2" x="1032" y="268" text-anchor="end">4:03</text>

      <rect x="544" y="298" width="502" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="560" y="312" width="32" height="32" rx="8" fill="#bbf7d0"/>
      <text class="t1" x="604" y="330">Sunset Lover</text>
      <text class="t2" x="604" y="348">Petit Biscuit</text>
      <text class="t2" x="1032" y="332" text-anchor="end">3:58</text>

      <rect x="544" y="362" width="502" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="560" y="376" width="32" height="32" rx="8" fill="#fecaca"/>
      <text class="t1" x="604" y="394">The Less I Know The Better</text>
      <text class="t2" x="604" y="412">Tame Impala</text>
      <text class="t2" x="1032" y="396" text-anchor="end">3:36</text>

      <rect x="544" y="426" width="502" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="560" y="440" width="32" height="32" rx="8" fill="#dbeafe"/>
      <text class="t1" x="604" y="458">Intro</text>
      <text class="t2" x="604" y="476">The xx</text>
      <text class="t2" x="1032" y="460" text-anchor="end">2:08</text>

      <rect x="544" y="512" width="240" height="42" rx="12" fill="#ec4899"/>
      <text class="t3" x="604" y="540" fill="#ffffff">Save to Spotify</text>
      <rect x="806" y="512" width="240" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <text class="t3" x="882" y="540" fill="#0f172a">Share link</text>
    </g>
  </g>
</svg>
