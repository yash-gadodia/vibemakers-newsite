<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <style>
      .ui { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .t0 { font-size: 18px; font-weight: 800; fill: #111827; }
      .t1 { font-size: 13px; font-weight: 600; fill: #374151; }
      .t2 { font-size: 12px; font-weight: 500; fill: #6b7280; }
      .t3 { font-size: 12px; font-weight: 700; fill: #111827; }
      .price { font-size: 12px; font-weight: 800; fill: #db2777; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="110" y="84" width="980" height="552" rx="18" fill="#ffffff"/>
    <rect x="110" y="84" width="980" height="56" rx="18" fill="#fff1f2"/>
    <rect x="110" y="122" width="980" height="18" fill="#fff1f2"/>

    <circle cx="146" cy="112" r="7" fill="#ef4444"/>
    <circle cx="170" cy="112" r="7" fill="#f59e0b"/>
    <circle cx="194" cy="112" r="7" fill="#22c55e"/>

    <text class="ui t0" x="240" y="118">Simple Marketplace</text>
    <text class="ui t2" x="240" y="138">Student‑only listings · Verified school email</text>

    <rect x="140" y="164" width="640" height="44" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <text class="ui t2" x="162" y="192">Search “calculator”, “notes”, “uniform”…</text>
    <rect x="792" y="164" width="140" height="44" rx="14" fill="#db2777"/>
    <text class="ui t3" x="836" y="192" fill="#ffffff">Sell</text>
    <rect x="940" y="164" width="150" height="44" rx="14" fill="#111827"/>
    <text class="ui t3" x="980" y="192" fill="#ffffff">Inbox</text>

    <g class="ui">
      <rect x="140" y="224" width="620" height="380" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
      <text class="t3" x="162" y="254">Recommended near you</text>
      <text class="t2" x="662" y="254" text-anchor="end">Updated 5m ago</text>

      <rect x="162" y="272" width="182" height="152" rx="14" fill="#f3f4f6"/>
      <rect x="162" y="272" width="182" height="86" rx="14" fill="#fee2e2"/>
      <text class="t1" x="176" y="388">Graphing Calculator</text>
      <text class="price" x="176" y="410">$35</text>
      <text class="t2" x="230" y="410">· Good condition</text>

      <rect x="360" y="272" width="182" height="152" rx="14" fill="#f3f4f6"/>
      <rect x="360" y="272" width="182" height="86" rx="14" fill="#e9d5ff"/>
      <text class="t1" x="374" y="388">Chem Notes (Sec 4)</text>
      <text class="price" x="374" y="410">$8</text>
      <text class="t2" x="412" y="410">· PDF + hardcopy</text>

      <rect x="558" y="272" width="182" height="152" rx="14" fill="#f3f4f6"/>
      <rect x="558" y="272" width="182" height="86" rx="14" fill="#bbf7d0"/>
      <text class="t1" x="572" y="388">PE Shirt (M)</text>
      <text class="price" x="572" y="410">$6</text>
      <text class="t2" x="604" y="410">· Meet at canteen</text>

      <rect x="162" y="440" width="182" height="152" rx="14" fill="#f3f4f6"/>
      <rect x="162" y="440" width="182" height="86" rx="14" fill="#dbeafe"/>
      <text class="t1" x="176" y="556">iPad Case (10.2)</text>
      <text class="price" x="176" y="578">$10</text>
      <text class="t2" x="212" y="578">· Black</text>

      <rect x="360" y="440" width="182" height="152" rx="14" fill="#f3f4f6"/>
      <rect x="360" y="440" width="182" height="86" rx="14" fill="#fde68a"/>
      <text class="t1" x="374" y="556">SBA Math Workbook</text>
      <text class="price" x="374" y="578">$4</text>
      <text class="t2" x="408" y="578">· Like new</text>

      <rect x="558" y="440" width="182" height="152" rx="14" fill="#f3f4f6"/>
      <rect x="558" y="440" width="182" height="86" rx="14" fill="#fecaca"/>
      <text class="t1" x="572" y="556">Guitar Stand</text>
      <text class="price" x="572" y="578">$12</text>
      <text class="t2" x="612" y="578">· Pickup only</text>
    </g>

    <g class="ui">
      <rect x="780" y="224" width="310" height="380" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
      <text class="t3" x="800" y="254">Chat</text>
      <text class="t2" x="1068" y="254" text-anchor="end">2 unread</text>
      <rect x="800" y="272" width="270" height="44" rx="12" fill="#f9fafb"/>
      <text class="t1" x="814" y="298">Marcus</text>
      <text class="t2" x="872" y="298">— “Can meet today 3pm?”</text>

      <rect x="800" y="328" width="270" height="44" rx="12" fill="#f9fafb"/>
      <text class="t1" x="814" y="354">Alicia</text>
      <text class="t2" x="872" y="354">— “Is it still available?”</text>

      <rect x="800" y="394" width="220" height="34" rx="999" fill="#dbeafe"/>
      <text class="t2" x="816" y="416" fill="#1e3a8a">Hi! Yes, still available 🙂</text>
      <rect x="850" y="436" width="220" height="34" rx="999" fill="#ffe4e6"/>
      <text class="t2" x="866" y="458" fill="#9f1239">Great! Can deal at MRT?</text>

      <rect x="800" y="556" width="270" height="34" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
      <text class="t2" x="814" y="578">Message…</text>
    </g>
  </g>
</svg>
