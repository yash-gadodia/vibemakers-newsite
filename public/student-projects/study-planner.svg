      <text class="ui t2" x="548" y="240">Tue</text>
      <text class="ui t2" x="634" y="240">Wed</text>
      <text class="ui t2" x="720" y="240">Thu</text>
      <text class="ui t2" x="806" y="240">Fri</text>
      <text class="ui t2" x="892" y="240">Sat</text>
      <text class="ui t2" x="978" y="240">Sun</text>

      <path d="M530 214 V576 M616 214 V576 M702 214 V576 M788 214 V576 M874 214 V576 M960 214 V576" stroke="#e2e8f0"/>

