<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <style>
      .ui { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .t0 { font-size: 18px; font-weight: 700; fill: #052e16; }
      .t1 { font-size: 13px; font-weight: 600; fill: #14532d; }
      .t2 { font-size: 12px; font-weight: 500; fill: #64748b; }
      .t3 { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .small { font-size: 11px; font-weight: 600; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="110" y="84" width="980" height="552" rx="18" fill="#ffffff"/>
    <rect x="110" y="84" width="980" height="56" rx="18" fill="#f0fdf4"/>
    <rect x="110" y="122" width="980" height="18" fill="#f0fdf4"/>

    <circle cx="146" cy="112" r="7" fill="#ef4444"/>
