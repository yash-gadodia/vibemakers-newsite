    <rect x="420" y="164" width="650" height="440" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="ui t3" x="444" y="196">February 2026</text>
    <text class="ui t2" x="934" y="196">Week view</text>
    <rect x="930" y="178" width="120" height="30" rx="999" fill="#dcfce7"/>
    <text class="ui t1" x="962" y="198">On</text>

    <g>
      <rect x="444" y="214" width="602" height="362" rx="12" fill="#f8fafc"/>
