    <text class="ui t0" x="240" y="118">Study Planner</text>
    <text class="ui t2" x="240" y="138">Exam mode · Feb 2026 · Daily goals enabled</text>

    <rect x="140" y="164" width="260" height="440" rx="14" fill="#f0fdf4" stroke="#dcfce7"/>
    <text class="ui t3" x="160" y="196">Today</text>
    <text class="ui t1" x="160" y="218">Wed, 12 Feb</text>

    <g class="ui">
      <rect x="160" y="238" width="220" height="34" rx="12" fill="#ffffff" stroke="#dcfce7"/>
      <circle cx="178" cy="255" r="7" fill="#22c55e"/>
      <path d="M174 255 l3 3 l7 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="small" x="196" y="260">English Paper 2 practice</text>

      <rect x="160" y="280" width="220" height="34" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="178" cy="297" r="7" fill="#ffffff" stroke="#94a3b8"/>
      <text class="small" x="196" y="302">Math: TYS (Q41–60)</text>

      <rect x="160" y="322" width="220" height="34" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="178" cy="339" r="7" fill="#ffffff" stroke="#94a3b8"/>
      <text class="small" x="196" y="344">Biology: Respiration notes</text>

      <rect x="160" y="372" width="220" height="58" rx="14" fill="#ffffff" stroke="#dcfce7"/>
      <text class="t2" x="174" y="396">Daily goal</text>
      <text class="t3" x="174" y="418">2h 30m focused study</text>
      <rect x="174" y="434" width="190" height="8" rx="999" fill="#e2e8f0"/>
      <rect x="174" y="434" width="122" height="8" rx="999" fill="#22c55e"/>
