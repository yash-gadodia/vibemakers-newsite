      <rect x="624" y="410" width="106" height="26" rx="8" fill="#fecaca"/>
      <text class="ui small" x="636" y="428" fill="#7f1d1d">Math consult</text>
      <rect x="882" y="458" width="154" height="26" rx="8" fill="#e9d5ff"/>
      <text class="ui small" x="894" y="476" fill="#581c87">Rest + recap</text>
