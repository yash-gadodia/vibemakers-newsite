<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <style>
      .ui { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .t0 { font-size: 18px; font-weight: 800; fill: #0f172a; }
      .t1 { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .t2 { font-size: 12px; font-weight: 500; fill: #64748b; }
      .t3 { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .pill { font-size: 11px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="110" y="84" width="980" height="552" rx="18" fill="#ffffff"/>
    <rect x="110" y="84" width="980" height="56" rx="18" fill="#ecfeff"/>
    <rect x="110" y="122" width="980" height="18" fill="#ecfeff"/>

    <circle cx="146" cy="112" r="7" fill="#ef4444"/>
    <circle cx="170" cy="112" r="7" fill="#f59e0b"/>
    <circle cx="194" cy="112" r="7" fill="#22c55e"/>

    <text class="ui t0" x="240" y="118">Study Buddy AI</text>
    <text class="ui t2" x="240" y="138">Spaced repetition · 38 cards due today</text>

    <rect x="140" y="164" width="260" height="440" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="ui t3" x="160" y="196">Decks</text>
    <rect x="160" y="214" width="220" height="40" rx="12" fill="#dbeafe"/>
    <text class="ui t1" x="174" y="240">Biology: Cells</text>
    <text class="ui t2" x="330" y="240" text-anchor="end">12 due</text>
    <rect x="160" y="260" width="220" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="ui t2" x="174" y="286">Chemistry: Redox</text>
    <text class="ui t2" x="330" y="286" text-anchor="end">8 due</text>
    <rect x="160" y="306" width="220" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="ui t2" x="174" y="332">Geography: Weather</text>
    <text class="ui t2" x="330" y="332" text-anchor="end">5 due</text>
    <rect x="160" y="352" width="220" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="ui t2" x="174" y="378">English: Vocab</text>
    <text class="ui t2" x="330" y="378" text-anchor="end">13 due</text>

    <rect x="420" y="164" width="650" height="440" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="ui t3" x="444" y="196">Card 7 of 38</text>
    <rect x="944" y="176" width="108" height="28" rx="999" fill="#dcfce7"/>
    <text class="ui pill" x="962" y="195" fill="#14532d">Focus</text>

    <rect x="444" y="214" width="602" height="232" rx="16" fill="#0f172a"/>
    <text class="ui" x="476" y="266" fill="#e2e8f0" font-size="13" font-weight="600">Prompt</text>
    <text class="ui" x="476" y="306" fill="#ffffff" font-size="22" font-weight="800">Explain photosynthesis in one paragraph.</text>
    <text class="ui" x="476" y="346" fill="#cbd5e1" font-size="13" font-weight="600">Hint: include chlorophyll, sunlight, glucose, oxygen</text>

    <rect x="444" y="466" width="392" height="38" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="ui t2" x="460" y="490">Ask Study Buddy…</text>
    <rect x="844" y="466" width="202" height="38" rx="12" fill="#2563eb"/>
    <text class="ui t3" x="904" y="490" fill="#ffffff">Show answer</text>

    <g class="ui">
      <rect x="444" y="518" width="138" height="34" rx="999" fill="#fee2e2"/>
      <text class="t3" x="486" y="540" fill="#7f1d1d">Hard</text>
      <rect x="592" y="518" width="138" height="34" rx="999" fill="#fef9c3"/>
      <text class="t3" x="632" y="540" fill="#854d0e">OK</text>
      <rect x="740" y="518" width="138" height="34" rx="999" fill="#dcfce7"/>
      <text class="t3" x="778" y="540" fill="#14532d">Easy</text>
      <rect x="888" y="518" width="158" height="34" rx="999" fill="#dbeafe"/>
      <text class="t3" x="924" y="540" fill="#1e3a8a">Perfect</text>
    </g>
  </g>
</svg>
